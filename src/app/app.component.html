<div class="app-shell"
     [class.sidebar-collapsed]="!sidebarOpen()"
     [class.has-toc]="hasToc()">
  <header class="app-header">
    <button class="btn-burger"
            type="button"
            (click)="toggleSidebar()"
            [attr.aria-label]="sidebarOpen() ? 'Collapse roadmap' : 'Open roadmap'"
            [title]="sidebarOpen() ? 'Collapse roadmap' : 'Open roadmap'">
      @if (sidebarOpen()) { <span aria-hidden="true">✕</span> }
      @else                { <span aria-hidden="true">☰</span> }
    </button>
    <a routerLink="/" class="brand">{{ title }}</a>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/phase-0" routerLinkActive="active">Phase 0</a>
      <a routerLink="/phase-1" routerLinkActive="active">Phase 1</a>
      <a routerLink="/phase-2" routerLinkActive="active">Phase 2</a>
      <a routerLink="/phase-3" routerLinkActive="active">Phase 3</a>
      <a routerLink="/phase-4" routerLinkActive="active">Phase 4</a>
    </nav>
  </header>

  <app-sidebar [phases]="phases" [open]="sidebarOpen()" />

  <!-- Backdrop: tap outside the drawer to close it on mobile -->
  <div class="sidebar-backdrop"
       (click)="toggleSidebar()"
       aria-hidden="true"></div>

  <main class="app-main">
    <router-outlet />
  </main>

  @if (hasToc()) {
    <app-phase-toc />
  }
</div>
