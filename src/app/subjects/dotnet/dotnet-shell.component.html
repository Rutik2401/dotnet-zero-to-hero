<div class="app-shell"
     [class.sidebar-collapsed]="!sidebarOpen()"
     [class.has-toc]="hasToc()">
  <header class="app-header">
    <button class="btn-burger"
            type="button"
            (click)="toggleSidebar()"
            [attr.aria-label]="sidebarOpen() ? 'Collapse phase list' : 'Open phase list'"
            [title]="sidebarOpen() ? 'Collapse phase list' : 'Open phase list'">
      @if (sidebarOpen()) { <span aria-hidden="true">✕</span> }
      @else                { <span aria-hidden="true">☰</span> }
    </button>
    <app-landing-nav class="app-header-nav" />
  </header>

  <app-sidebar [phases]="phases" [open]="sidebarOpen()" />

  <!-- Backdrop: tap outside the drawer to close it on mobile -->
  <div class="sidebar-backdrop"
       (click)="toggleSidebar()"
       aria-hidden="true"></div>

  <main class="app-main">
    <router-outlet />
    <app-landing-footer />
  </main>

  @if (hasToc()) {
    <app-phase-toc />
  }
</div>
